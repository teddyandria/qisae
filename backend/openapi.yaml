  /api/photos/:
    get:
      operationId: photos_list
      description: Upload et suppression des photos d'un profil (multipart).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - in: query
        name: profil
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - avec_barbe
          - avec_lunettes
          - cheveux_actuels
          - pied
          - portrait
          - profil
          - recente
          - sans_barbe
          - sans_lunettes
        description: |-
          * `portrait` - Portrait
          * `pied` - En pied
          * `profil` - Profil
          * `recente` - Photo récente
          * `sans_lunettes` - Sans lunettes
          * `avec_lunettes` - Avec lunettes
          * `cheveux_actuels` - Cheveux actuels
          * `avec_barbe` - Avec barbe
          * `sans_barbe` - Sans barbe
      tags:
      - photos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoEcriture'
          description: ''
    post:
      operationId: photos_create
      description: Upload et suppression des photos d'un profil (multipart).
      tags:
      - photos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoEcriture'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoEcriture'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoEcriture'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoEcriture'
          description: ''
  /api/photos/{id}/:
