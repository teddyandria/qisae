  /api/profils/:
    get:
      operationId: profils_list
      description: |-
        Recherche à facettes, consultation et saisie d'un profil.

        `ensure_csrf_cookie` sur la liste : le front récupère le cookie CSRF en
        affichant la planche, avant tout envoi de formulaire.
      parameters:
      - in: query
        name: accent
        schema:
          type: string
      - in: query
        name: actif
        schema:
          type: boolean
      - in: query
        name: age_max
        schema:
          type: number
      - in: query
        name: age_min
        schema:
          type: number
      - in: query
        name: apparence
        schema:
          type: string
      - in: query
        name: avec_photo
        schema:
          type: boolean
      - in: query
        name: barbe
        schema:
          type: boolean
      - in: query
        name: besoin_transport
        schema:
          type: boolean
      - in: query
        name: calvitie
        schema:
          type: string
          enum:
          - chauve
          - degarni
          - non
        description: |-
          * `non` - Non
          * `degarni` - Dégarni
          * `chauve` - Chauve
      - in: query
        name: cheveux_colores
        schema:
          type: boolean
      - in: query
        name: competence_artistique
        schema:
          type: string
        description: Compétence artistique, éventuellement `Compétence:niveau_min`
          (1→4)
      - in: query
        name: competence_conduite
        schema:
          type: string
      - in: query
        name: competence_particuliere
        schema:
          type: string
      - in: query
        name: composition
        schema:
          type: string
          enum:
          - amis
          - couple
          - duo
          - famille
          - fratrie
          - groupe_pro
          - groupe_sportif
          - seul
          - trio
        description: |-
          * `seul` - Seul
          * `couple` - Couple
          * `fratrie` - Fratrie
          * `famille` - Famille
          * `amis` - Groupe d'amis
          * `duo` - Duo
          * `trio` - Trio
          * `groupe_sportif` - Groupe sportif
          * `groupe_pro` - Groupe professionnel
      - in: query
        name: costume
        schema:
          type: string
      - in: query
        name: couleur_cheveux
        schema:
          type: string
          enum:
          - blanc
          - blond
          - brun
          - chatain
          - colore
          - gris
          - noir
          - roux
        description: |-
          * `blond` - Blond
          * `chatain` - Châtain
          * `brun` - Brun
          * `noir` - Noir
          * `roux` - Roux
          * `gris` - Gris
          * `blanc` - Blanc
          * `colore` - Coloré (fantaisie)
      - in: query
        name: couleur_yeux
        schema:
          type: string
          enum:
          - bleu
          - gris
          - marron
          - noir
          - noisette
          - vert
        description: |-
          * `marron` - Marron
          * `bleu` - Bleu
          * `vert` - Vert
          * `noisette` - Noisette
          * `gris` - Gris
          * `noir` - Noir
      - in: query
        name: deja_figurant
        schema:
          type: boolean
      - in: query
        name: departement
        schema:
          type: string
      - in: query
        name: disponibilite
        schema:
          type: string
          enum:
          - immediate
          - sous_48h
          - sur_demande
          - vacances
          - week_ends
        description: |-
          * `immediate` - Immédiate
          * `sous_48h` - Sous 48 h
          * `week_ends` - Week-ends uniquement
          * `vacances` - Vacances scolaires
          * `sur_demande` - Sur demande
      - in: query
        name: distance_max_km_min
        schema:
          type: integer
      - in: query
        name: instrument
        schema:
          type: string
        description: Instrument, éventuellement `Instrument:niveau_min` (1→4)
      - in: query
        name: langue
        schema:
          type: string
        description: Langue, éventuellement `Langue:niveau_min` (A1→C2, LM)
      - in: query
        name: lentilles
        schema:
          type: boolean
      - in: query
        name: longueur_cheveux
        schema:
          type: string
          enum:
          - courts
          - longs
          - mi_longs
        description: |-
          * `courts` - Courts
          * `mi_longs` - Mi-longs
          * `longs` - Longs
      - in: query
        name: lunettes
        schema:
          type: boolean
      - in: query
        name: metier
        schema:
          type: string
      - in: query
        name: mineur
        schema:
          type: boolean
      - in: query
        name: moustache
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
