components:
  schemas:
    Accent:
      type: object
      description: Alimente les listes du rail de filtres.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
      required:
      - id
      - nom
    Apparence:
      type: object
      description: Alimente les listes du rail de filtres.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
      required:
      - id
      - nom
    BlankEnum:
      enum:
      - ''
    CalvitieEnum:
      enum:
      - non
      - degarni
      - chauve
      type: string
      description: |-
        * `non` - Non
        * `degarni` - Dégarni
        * `chauve` - Chauve
    CategorieEnum:
      enum:
      - collectif
      - individuel
      type: string
      description: |-
        * `collectif` - Sport collectif
        * `individuel` - Sport individuel
    CompetenceArtistique:
      type: object
      description: Alimente les listes du rail de filtres.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
      required:
      - id
      - nom
    CompetenceArtistiqueEcriture:
      type: object
      description: Une ligne de through model telle que la poste le formulaire.
      properties:
        niveau:
          type: string
        competence:
          type: integer
      required:
      - competence
      - niveau
    CompetenceConduite:
      type: object
      description: Alimente les listes du rail de filtres.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
      required:
      - id
      - nom
    CompetenceParticuliere:
      type: object
      description: Alimente les listes du rail de filtres.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
      required:
      - id
      - nom
    CompositionEnum:
      enum:
      - seul
      - couple
      - fratrie
      - famille
      - amis
      - duo
      - trio
      - groupe_sportif
      - groupe_pro
      type: string
      description: |-
        * `seul` - Seul
        * `couple` - Couple
        * `fratrie` - Fratrie
        * `famille` - Famille
        * `amis` - Groupe d'amis
        * `duo` - Duo
        * `trio` - Trio
        * `groupe_sportif` - Groupe sportif
        * `groupe_pro` - Groupe professionnel
    Connexion:
      type: object
      properties:
        identifiant:
          type: string
          writeOnly: true
        mot_de_passe:
          type: string
          writeOnly: true
      required:
      - identifiant
      - mot_de_passe
    Costume:
      type: object
      description: Alimente les listes du rail de filtres.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
      required:
      - id
      - nom
    CouleurCheveuxEnum:
      enum:
      - blond
      - chatain
      - brun
      - noir
      - roux
      - gris
      - blanc
      - colore
      type: string
      description: |-
        * `blond` - Blond
        * `chatain` - Châtain
        * `brun` - Brun
        * `noir` - Noir
        * `roux` - Roux
        * `gris` - Gris
        * `blanc` - Blanc
        * `colore` - Coloré (fantaisie)
    CouleurYeuxEnum:
      enum:
      - marron
      - bleu
      - vert
      - noisette
      - gris
      - noir
      type: string
      description: |-
        * `marron` - Marron
        * `bleu` - Bleu
        * `vert` - Vert
        * `noisette` - Noisette
        * `gris` - Gris
        * `noir` - Noir
    Departement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 3
        nom:
          type: string
          maxLength: 120
        region:
          type: string
          readOnly: true
      required:
      - code
      - id
      - nom
      - region
    DisponibiliteEnum:
      enum:
      - immediate
      - sous_48h
      - week_ends
      - vacances
      - sur_demande
      type: string
      description: |-
        * `immediate` - Immédiate
        * `sous_48h` - Sous 48 h
        * `week_ends` - Week-ends uniquement
        * `vacances` - Vacances scolaires
        * `sur_demande` - Sur demande
    DisponibiliteScolaireEnum:
      enum:
      - vacances
      - mercredi
      - hors_scolaire
      - sans_contrainte
      type: string
      description: |-
        * `vacances` - Vacances scolaires uniquement
        * `mercredi` - Mercredi et week-ends
        * `hors_scolaire` - Hors temps scolaire
        * `sans_contrainte` - Sans contrainte particulière
    Instrument:
      type: object
      description: Alimente les listes du rail de filtres.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
      required:
      - id
      - nom
    InstrumentEcriture:
      type: object
      description: Une ligne de through model telle que la poste le formulaire.
      properties:
        niveau:
          type: string
        instrument:
          type: integer
      required:
      - instrument
      - niveau
    Langue:
      type: object
      description: Alimente les listes du rail de filtres.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
      required:
      - id
      - nom
    LangueEcriture:
      type: object
      description: Une ligne de through model telle que la poste le formulaire.
      properties:
        niveau:
          type: string
        langue:
          type: integer
        accent:
          type: integer
          nullable: true
      required:
      - langue
      - niveau
    LongueurCheveuxEnum:
      enum:
      - courts
      - mi_longs
      - longs
      type: string
      description: |-
        * `courts` - Courts
        * `mi_longs` - Mi-longs
        * `longs` - Longs
    Metier:
      type: object
      description: Alimente les listes du rail de filtres.
      properties:
        id:
          type: integer
          readOnly: true
        nom:
          type: string
          maxLength: 120
      required:
      - id
      - nom
    Mineur:
      type: object
      description: |-
        Présence d'un dossier mineur, sans exposer l'identité du responsable légal
        dans une réponse de recherche.
      properties:
        autorisation_parentale_signee:
          type: boolean
          readOnly: true
        autorisation_travail_obtenue:
          type: boolean
          readOnly: true
        disponibilite_scolaire:
          type: string
          readOnly: true
      required:
      - autorisation_parentale_signee
      - autorisation_travail_obtenue
      - disponibilite_scolaire
    MineurEcriture:
      type: object
      properties:
        responsable_legal_nom:
          type: string
          maxLength: 150
        responsable_legal_prenom:
          type: string
          maxLength: 150
        responsable_legal_lien:
          $ref: '#/components/schemas/ResponsableLegalLienEnum'
        responsable_legal_telephone:
          type: string
          maxLength: 30
        responsable_legal_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        autorisation_parentale_signee:
          type: boolean
        autorisation_parentale_le:
          type: string
          format: date
          nullable: true
        autorisation_travail_obtenue:
          type: boolean
        autorisation_travail_reference:
          type: string
          maxLength: 100
        autorisation_travail_expire_le:
          type: string
          format: date
          nullable: true
        disponibilite_scolaire:
          oneOf:
          - $ref: '#/components/schemas/DisponibiliteScolaireEnum'
          - $ref: '#/components/schemas/BlankEnum'
        remarques: {}
      required:
      - responsable_legal_lien
      - responsable_legal_nom
      - responsable_legal_prenom
    PaginatedProfilListeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProfilListe'
    PatchedPhotoEcriture:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        profil:
          type: integer
        type:
          $ref: '#/components/schemas/TypeEnum'
        image:
          type: string
          format: uri
        prise_le:
          type: string
          format: date
          nullable: true
    PatchedProfilEcriture:
      type: object
      description: |-
        Saisie d'un profil depuis le front (voir decisions/0001).

        Les through models arrivent en listes imbriquées ; DRF ne sait pas les écrire
        seul, d'où le `create`/`update` explicite plus bas.
      properties:
        id:
          type: integer
          readOnly: true
        sports:
          type: array
          items:
            $ref: '#/components/schemas/SportEcriture'
          writeOnly: true
        langues:
          type: array
          items:
            $ref: '#/components/schemas/LangueEcriture'
          writeOnly: true
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentEcriture'
          writeOnly: true
        competences_artistiques:
          type: array
          items:
            $ref: '#/components/schemas/CompetenceArtistiqueEcriture'
          writeOnly: true
        vehicules:
          type: array
          items:
            $ref: '#/components/schemas/VehiculeEcriture'
          writeOnly: true
        mineur:
          allOf:
          - $ref: '#/components/schemas/MineurEcriture'
          writeOnly: true
          nullable: true
        reference:
          type: string
          nullable: true
          maxLength: 20
        nom:
          type: string
          maxLength: 150
        prenom:
          type: string
          maxLength: 150
        nom_artiste:
          type: string
          maxLength: 150
        sexe:
          oneOf:
          - $ref: '#/components/schemas/SexeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        date_naissance:
          type: string
          format: date
          nullable: true
        age_apparent_min:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        age_apparent_max:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        telephone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        disponibilite:
          oneOf:
